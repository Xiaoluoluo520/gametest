<!DOCTYPE html>
<!--
  ============================================================
  疯狂料理屋 (Cooking Frenzy) v2.9.0  —  2026-09-08
  ------------------------------------------------------------
  类型    : 类《胡闹厨房》单人料理游戏（限时赛 + 无尽模式 + 教程）
  技术    : 原生 JavaScript + Canvas 2D，低分辨率像素渲染（640×360）
  画风    : 泰拉瑞亚式像素风；16×16 瓷砖；24×24 统一 SPRITES 像素矩阵
  素材    : 代码像素矩阵 + 32 色调色板（首选，离线可玩）；字体 Press Start 2P
  许可证  : 代码 MIT；字体 SIL OFL 1.1；全部素材可免费商用
  ------------------------------------------------------------
  v2.2 新增：640×360 分辨率与缩放修复 / 难度平衡(热身期+参数) /
              24×24 食物材质 / 布局重排 / 教程模式 / 配料表图鉴
  v2.3 新增：移速参数化+缓冲 / 饮料机通用逻辑重构 / ESC 暂停菜单 /
              历史最高分记录(6组)与清除入口
  v2.4 修复：饮料机灌装距离判定(根因:以左上角为基准导致误取消) /
              版本可视化 + 交互链路调试日志(?debug=1)
  v2.6 重构：删除盘子机制 / 组合系统重写(单id+计数,合并合法子集判定) /
              成品图标切换修复 / 新增面包胚食材(汉堡=胚+肉饼+生菜)
  v2.7 修复：组合判定根因(parts元素格式不一致) / PWA(manifest+SW) /
              触屏操控(摇杆+交互+菜单) / 竖屏提示
  v2.8 修复：成品转化判定统一化 checkAndTransform（锅产出即时成品化）
  v2.9 修复：套餐交付改为无序需求集合（先交饮料不再判错）+ 最近顾客分配
              手机 App 版完善（触屏命中区/禁长按菜单/内联 manifest）
  ============================================================
-->

<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin:0; height:100%; overflow:hidden; background:#140e08; color:#fff;
    font-family:'Press Start 2P','PingFang SC','Microsoft YaHei',monospace;
    user-select:none; -webkit-user-select:none; display:flex; align-items:center; justify-content:center;
    overscroll-behavior:none; touch-action:none; -webkit-overflow-scrolling:none; -webkit-touch-callout:none; }
  /* 深色像素纹理信封边（非纯黑） */

    background-image:linear-gradient(45deg,#1c1410 25%,transparent 25%,transparent 75%,#1c1410 75%),
                     linear-gradient(45deg,#1c1410 25%,transparent 25%,transparent 75%,#1c1410 75%);

  #game { image-rendering:pixelated; image-rendering:crisp-edges; display:block; box-shadow:0 0 0 2px #000; }

  /* ---------- 触屏（半透明不挡视野，多点触控） ---------- */
  #touch { position:fixed; inset:0; pointer-events:none; z-index:50; display:none; }

  #joyKnob { position:absolute; left:50%; top:50%; width:52px; height:52px; margin:-26px; border-radius:50%;

  #btnE, #btnMenu { position:fixed; right:20px; border-radius:14px; border:3px solid rgba(255,255,255,.75);

  #btnE { bottom:24px; width:84px; height:84px; font-size:14px; background:rgba(245,197,66,.85); color:#2a1a12; }

  /* ---------- 启动画面 / 竖屏提示 ---------- */
  #splash { position:fixed; inset:0; z-index:90; display:flex; flex-direction:column; align-items:center;

  /* ---------- 通用界面 ---------- */
  .screen { position:fixed; inset:0; z-index:60; display:flex; flex-direction:column; align-items:center;

  .screen.hidden { display:none; }
  h1.title { font-size:clamp(16px,3vw,26px); margin:0; color:#f5c542; text-shadow:3px 3px 0 #7a4a1e; text-align:center; }

  .cards { display:flex; gap:14px; flex-wrap:wrap; justify-content:center; }

  .g-section { color:#8fd14f; font-size:12px; margin:14px 0 6px; border-bottom:2px solid #7a4a1e; padding-bottom:4px; }
  .g-recipe { display:flex; align-items:center; gap:12px; background:#3a2a1a; border:3px solid #7a4a1e;
    padding:10px; margin:8px 0; }

  .g-recipe .g-name { color:#f5c542; font-size:11px; }
  .g-recipe .g-info { color:#c9b79a; font-size:10px; margin-top:4px; line-height:1.7; }

  /* ---------- 结算 / 设置 / 首次提示 ---------- */
  #resultBox { background:#2a1a12; border:5px solid #7a4a1e; padding:22px 30px; text-align:center; box-shadow:6px 6px 0 #000; max-width:94vw; }

  .stats { display:grid; grid-template-columns:auto auto; gap:6px 18px; justify-content:center; margin:12px 0; font-size:11px; text-align:left; }
  .stats .sv { text-align:right; color:#f5c542; }
  .newbest { color:#f58a1f; font-size:10px; margin-bottom:8px; animation:newbestPulse .6s infinite alternate; }
  @keyframes newbestPulse { from { transform:scale(1); opacity:1; } to { transform:scale(1.18); opacity:.6; } }
  .rec { font-size:9px; color:#8fd14f; margin-top:8px; line-height:1.7; }
  #scrPause { z-index:75; background:rgba(0,0,0,.6); }
  #scrPause .btn.selected { outline:3px solid #f5c542; background:#ffe08a; color:#2a1a12; }
  .toggle { cursor:pointer; display:flex; align-items:center; gap:10px; background:#3a2a1a; border:3px solid #7a4a1e; padding:10px 16px; }
  .toggle .box { width:18px; height:18px; border:3px solid #fff; background:#000; position:relative; }
  .toggle.on .box::after { content:''; position:absolute; left:3px; top:3px; width:8px; height:8px; background:#4caf50; }
</style>

<script>
'use strict';
/* ============================================================
 * 1. 常量与配置
 * ============================================================ */
const VERSION='2.9.0', DATE='2026-09-08';
const DEBUG=(new URLSearchParams(location.search)).get('debug')==='1'; // URL 加 ?debug=1 开启调试日志
function dlog(tag,msg){ if(DEBUG) console.log('[cook]['+tag+']', msg); }
const W=640, H=360;                 // 内部分辨率 16:9
const TILE=16;
const KITCHEN_TOP=32, COUNTER_Y=232, COUNTER_H=16;
const SLOT_Y=268, DOOR_X=320;
const COOK_TIME=6, CUT_TIME=0.8, DRINK_FILL=2, MODE_TIME=120;
const DRINK_BONUS=50, TIMEOUT_PENALTY=60, WRONG_PENALTY=30, DRINK_ONLY_POINTS=80;
const BASE_PATIENCE=40, BASE_BURN=5;
const WARMUP_TIME=25;              // 热身期秒数
/* 难度无关的全局配置：移速 / 加速缓冲（格/秒、格/秒²），调平衡只改这里 */
const CONFIG={ playerSpeed:9, playerAccel:40 };

/* ============================================================
 * 2. 调色板（≤32 色）+ SPRITES 像素矩阵模块（24×24，唯一精灵源）
 * ============================================================ */
const PAL=[ null,'#17121c','#e8452c','#ff7a5a','#a82818','#3f9e2f','#8fd14f','#2a6b1f',
  '#f0a8a0','#ffd6c8','#c07070','#c97a3e','#e0a060','#8a4a20','#5a3a20','#2a1a10',
  '#f7f0dc','#d8cfae','#f5c542','#ffe08a','#f58a1f','#efe6cf','#d8cba8','#8a93a0',
  '#b8c0c8','#5a6268','#ffa020','#ffc060','#5a2c10','#7a4020','#d0d8e0','#ffffff' ];
const C={ OUT:1,RED:2,REDL:3,REDD:4,GREEN:5,GREENL:6,GREEND:7,PINK:8,PINKL:9,PINKD:10,
  BROWN:11,BROWNL:12,BROWND:13,BURNT:14,BURNTD:15,CREAM:16,CREAMD:17,YELLOW:18,YELLOWL:19,
  ORANGE:20,RICEW:21,RICED:22,GRAY:23,GRAYL:24,GRAYD:25,DJUICE:26,DJUICEL:27,DCOLA:28,DCOLAL:29,CUPHILITE:30,WHITE:31 };

/* 像素网格构建器：二维数组 + 调色板 */
const _sprCache={};
function grid(){ const g=[]; for(let y=0;y<24;y++){ g[y]=[]; for(let x=0;x<24;x++) g[y][x]=0; } return g; }
function spx(g,x,y,c){ if(x>=0&&y>=0&&x<24&&y<24) g[y][x]=c; }
function srect(g,x,y,w,h,c){ for(let yy=y;yy<y+h;yy++) for(let xx=x;xx<x+w;xx++) spx(g,xx,yy,c); }
function shline(g,x,y,w,c){ for(let xx=x;xx<x+w;xx++) spx(g,xx,y,c); }
function scircle(g,cx,cy,r,c){ for(let yy=-r;yy<=r;yy++) for(let xx=-r;xx<=r;xx++) if(xx*xx+yy*yy<=r*r) spx(g,cx+xx,cy+yy,c); }
function sellipse(g,cx,cy,rx,ry,c){ for(let yy=-ry;yy<=ry;yy++) for(let xx=-rx;xx<=rx;xx++) if((xx*xx)/(rx*rx)+(yy*yy)/(ry*ry)<=1) spx(g,cx+xx,cy+yy,c); }
function gridCanvas(g){ const cv=document.createElement('canvas'); cv.width=24; cv.height=24; const c=cv.getContext('2d');
  for(let y=0;y<24;y++) for(let x=0;x<24;x++){ const col=PAL[g[y][x]]; if(col){ c.fillStyle=col; c.fillRect(x,y,1,1); } } return cv; }
function sprite(name){ if(_sprCache[name]) return _sprCache[name]; const b=SPRITE_FN[name]; if(!b) return _fallbackCanvas; return (_sprCache[name]=b()); }
const _fallbackCanvas=(function(){ const cv=document.createElement('canvas'); cv.width=24; cv.height=24; const c=cv.getContext('2d'); c.fillStyle='#f58a1f'; c.fillRect(6,6,12,12); return cv; })();
const SPRITE_FN={
  /* —— 番茄：整颗(带果蒂/籽感) → 切半(果肉+籽) → 煮软(深色) → 焦黑 —— */
  tomato_raw(){ const g=grid(); scircle(g,12,12,9,C.OUT); scircle(g,12,12,8,C.RED);
    scircle(g,8,8,3,C.REDL); sellipse(g,14,15,6,3,C.REDD);
    srect(g,10,2,4,3,C.GREEN); srect(g,9,3,2,2,C.GREENL); srect(g,11,4,1,2,C.GREEND); return gridCanvas(g); },
  tomato_cut(){ const g=grid(); scircle(g,12,12,9,C.OUT); scircle(g,12,12,8,C.RED);
    sellipse(g,9,9,5,5,C.REDL); spx(g,8,9,C.REDL); spx(g,11,11,C.REDL);  // 切面果肉
    spx(g,9,8,C.YELLOWL); spx(g,11,9,C.YELLOWL); spx(g,8,11,C.YELLOWL); spx(g,10,12,C.YELLOWL); // 籽
    sellipse(g,14,15,6,3,C.REDD); srect(g,10,2,4,3,C.GREEN); return gridCanvas(g); },
  tomato_cooked(){ const g=grid(); scircle(g,12,13,9,C.OUT); scircle(g,12,13,8,C.REDD);
    scircle(g,9,10,3,C.RED); sellipse(g,13,16,6,3,C.REDD); sellipse(g,10,15,5,3,C.REDL);
    srect(g,10,4,4,2,C.REDD); return gridCanvas(g); },
  tomato_burnt(){ const g=grid(); scircle(g,12,12,9,C.OUT); scircle(g,12,12,8,C.BURNT);
    spx(g,9,10,C.BURNTD); spx(g,14,9,C.BURNTD); spx(g,11,15,C.BURNTD); spx(g,8,13,C.BURNTD);
    sellipse(g,14,15,6,3,C.BURNTD); return gridCanvas(g); },
  /* —— 生菜：整颗(叶脉) → 切丝(浅色丝) —— */

function setupTouch(){
  if(!(('ontouchstart' in window)||navigator.maxTouchPoints>0)) return;
  document.getElementById('touch').style.display='block';
  const joy=document.getElementById('joy'), knob=document.getElementById('joyKnob');
  joy.addEventListener('touchstart',(e)=>{ joyId=e.changedTouches[0].identifier; setJoy(e); e.preventDefault(); });
  joy.addEventListener('touchmove',(e)=>{ setJoy(e); e.preventDefault(); });
  joy.addEventListener('touchend',(e)=>{ if(e.changedTouches[0].identifier===joyId){ touch.active=false; touch.dx=touch.dy=0; knob.style.left='50%'; knob.style.top='50%'; } });
  document.getElementById('btnE').addEventListener('touchstart',(e)=>{ onInteractPressed(); e.preventDefault(); });
}
function setJoy(e){
  const joy=document.getElementById('joy'), knob=document.getElementById('joyKnob');
  const r=joy.getBoundingClientRect(); const cx=r.left+r.width/2, cy=r.top+r.height/2;
  let t=null; for(const tc of e.changedTouches) if(tc.identifier===joyId) t=tc;
  if(!t) return;
  let dx=t.clientX-cx, dy=t.clientY-cy; const m=Math.hypot(dx,dy), max=r.width/2-26;
  if(m>max){ dx=dx/m*max; dy=dy/m*max; }
  knob.style.left=(cx-r.left+dx)+'px'; knob.style.top=(cy-r.top+dy)+'px';
  touch.active=true; touch.dx=dx/max; touch.dy=dy/max;
}

/* ============================================================
 * 6. 实体与状态
 * ============================================================ */
function mkIngredient(type,state){ return { type:'ingredient', ing:type, state:state||'raw' }; }
/* —— 组合系统：单品=ingredient；组合组/成品=item{ id,count,parts }。
 * id：中间态=首个食材精灵名，完成瞬间=成品菜品ID；渲染/交付只认 id。 —— */
/* 统一 parts 元素格式为 [食材ID, 状态]，与 RECIPES.parts 完全一致（修复：此前返回对象导致键恒为 undefined:undefined） */
function toParts(h){ if(h.type==='ingredient') return [[h.ing,h.state]]; if(h.type==='item') return h.parts.slice(); return []; }
function subMultiset(parts, recipeParts){
  const need={}; for(const p of recipeParts){ const k=p[0]+':'+p[1]; need[k]=(need[k]||0)+1; }
  for(const p of parts){ const k=p[0]+':'+p[1]; if(!need[k]) return false; need[k]--; }
  return true;
}
function isLegalSubset(parts){ return Object.values(RECIPES).some(r=>subMultiset(parts, r.parts)); }
function matchRecipe(parts){
  const a=parts.map(p=>p[0]+':'+p[1]).sort().join('|');
  return Object.values(RECIPES).find(r=> r.parts.map(p=>p[0]+':'+p[1]).sort().join('|')===a);
}
/* —— 全游戏唯一的成品判定入口 ——
 * 传入 ingredient 或 item：命中完整配方 → 返回 id=成品ID 的 item；否则原样返回。
 * 任何物品状态变化点（合并 / 煮熟完成 / 出锅 / 台面拿起 / 灌装完成）都必须调用本函数。 */
function checkAndTransform(obj, fxX, fxY){
  if (!obj) return obj;
  if (obj.type!=='ingredient' && obj.type!=='item') return obj;   // 饮料/灭火器不参与成品判定
  const parts = toParts(obj);
  if (!parts.length) return obj;
  const r = matchRecipe(parts);
  if (r){
    if (!(obj.type==='item' && obj.id===r.id)){                    // 首次完成 → 反馈
      SFX.success();
      addFloatAt(fxX!=null?fxX:G.player.x, fxY!=null?fxY:G.player.y-24, '完成 '+r.name+'！', '#8fd14f');
    }
    return { type:'item', id:r.id, count:parts.length, parts };
  }
  if (obj.type==='ingredient') return obj;                         // 仅构成部分配方 → 保持食材态，不误转
  return { type:'item', id:ING[parts[0][0]].sp[parts[0][1]], count:parts.length, parts };
}
/* 由 parts 构造组合组并立即做成品判定 */
function makeGroup(parts){ return checkAndTransform({ type:'item', id:ING[parts[0][0]].sp[parts[0][1]], count:parts.length, parts }); }
function isIngredient(it){ return it && it.type==='ingredient'; }
function itemSprite(it){
  if(it.type==='ingredient'){ const g=ING[it.ing]; return g.sp[it.state]||g.sp.raw; }
  if(it.type==='item') return RECIPES[it.id] ? RECIPES[it.id].sprite : it.id; // 成品ID查表取图，中间态id即精灵名
  if(it.type==='drink') return DRINKS[it.drink].sprite;
  if(it.type==='extinguisher') return 'exting';
  return null;
}
function makeStation(id,type,x,y,w,h,opt){ return Object.assign({ id,type,x,y,w,h,cx:x+w/2,cy:y+h/2,surface:null,progress:0,cooking:false,cutting:false,burning:false,fire:0,fxTimer:0 },opt||{}); }

function slotX(i,n){ return Math.round(W*(i+1)/(n+1)); }
function freeSlotIndex(){ for(let i=0;i<G.slots.length;i++) if(!G.slots[i].occupied) return i; return -1; }
function makeCustomer(slot, scripted){
  const n=G.difficulty?G.difficulty.maxOrders:4;
  return { x:DOOR_X, y:376, tx:slotX(slot,n), ty:SLOT_Y, slot, state:'enter', look:uniqueLook(), walkPhase:rand(0,3),
    mood:0, order:null, foodDone:false, drinkDone:false, reactT:0, reactType:'happy', infinitePatience:false, scripted:scripted||null };
}
function assignOrder(c){
  let mode, dish, drink;
  if (c.scripted){ mode=c.scripted.mode; dish=c.scripted.recipe; drink=c.scripted.drink; }
  else {
    mode=pickOrderMode();
    dish=(mode==='drink')?null:pickUniqueRecipe();
    drink=(mode==='combo'||mode==='drink')?(Math.random()<0.5?'orange':'cola'):null;
  }
  const base=effectivePatience();
  const patience=(mode==='drink')?base*0.7:base;
  c.order={ mode, recipe:dish, drink, patience, total:patience, done:[] }; // done = 已完成需求 token 集合（无序）
  c.foodDone=false; c.drinkDone=false;
  c.infinitePatience = (G.mode==='tutorial');
}
function effectivePatience(){
  const d=G.difficulty;
  let p=BASE_PATIENCE*d.patienceMult;
  if (G.mode==='endless') p*=endlessPatienceScale();
  if (G.elapsed < WARMUP_TIME) p*=1.3; // 热身期
  return p;
}
function endlessPatienceScale(){
  const tier=Math.min(5, Math.floor(G.elapsed/60));
  return Math.max(0.65, 1 - tier*0.07);
}
function pickOrderMode(){
  const w=G.difficulty.orderWeights;
  let mode=weightedPick(w);
  if (G.recentModes.length>=2 && G.recentModes[0]===mode && G.recentModes[1]===mode){
    const others=['dish','combo','drink'].filter(m=>m!==mode);
    mode=weightedPick({ [others[0]]:w[others[0]], [others[1]]:w[others[1]] });
  }
  G.recentModes=[mode,...G.recentModes].slice(0,3);
  return mode;
}
function pickUniqueRecipe(){
  const used=new Set(G.customers.filter(c=>c.order&&c.order.recipe&&c.state!=='gone').map(c=>c.order.recipe.id));
  const avail=Object.values(RECIPES).filter(r=>!used.has(r.id));
  if(!avail.length) return randomRecipe();
  return avail[randInt(0,avail.length-1)];
}
function randomRecipe(){ const ks=Object.keys(RECIPES); return RECIPES[ks[randInt(0,ks.length-1)]]; }
function trySpawnCustomer(){
  if (G.mode==='tutorial') return;
  const active=G.customers.filter(c=>c.state!=='gone'&&c.state!=='leave').length;
  if (active>=G.difficulty.maxOrders) return;
  const slot=freeSlotIndex(); if(slot<0) return;
  G.slots[slot].occupied=true;
  G.customers.push(makeCustomer(slot));
  SFX.enter();
}
function removeCustomer(c){ c.state='gone'; if(c.slot!=null) G.slots[c.slot].occupied=false; }
function updateCustomers(dt){
  for (const c of G.customers){
    if (c.state==='gone') continue;
    c.walkPhase += dt*((c.state==='enter'||c.state==='leave')?9:0);
    if (c.state==='enter'){
      const dx=c.tx-c.x, dy=c.ty-c.y, d=Math.hypot(dx,dy);
      if (d<3){ c.x=c.tx; c.y=c.ty; c.state='queue'; assignOrder(c); }
      else { c.x+=dx/d*48*dt; c.y+=dy/d*48*dt; }
    } else if (c.state==='queue'){
      if (!c.infinitePatience){
        c.order.patience -= dt;
        const f=c.order.patience/c.order.total;
        c.mood = f>0.5?0:(f>0.25?1:2);
        if (c.order.patience<=0) timeoutCustomer(c);
      } else c.mood=0;
    } else if (c.state==='react'){
      c.reactT += dt;
      if (c.reactT>0.8) c.state='leave';
    } else if (c.state==='leave'){
      const dx=DOOR_X-c.x, dy=380-c.y, d=Math.hypot(dx,dy);
      c.x+=dx/d*52*dt; c.y+=dy/d*52*dt;
      if (c.y>374) removeCustomer(c);
    }
  }
  G.refreshTimer -= dt;
  const interval = (G.mode==='endless') ? Math.max(3.2, 7 - Math.min(5,Math.floor(G.elapsed/60))*0.8) : (G.elapsed<WARMUP_TIME?7:5);
  if (G.refreshTimer<=0){ trySpawnCustomer(); G.refreshTimer=interval; }
}

/* —— 订单需求 = 无序 token 集合：'dish:<菜ID>' / 'drink:<饮料>'，不依赖交付顺序 —— */
function orderTokens(c){ const t=[]; if(c.order.recipe) t.push('dish:'+c.order.recipe.id); if(c.order.drink) t.push('drink:'+c.order.drink); return t; }
function orderRemaining(c){ const done=c.order.done||[]; return orderTokens(c).filter(t=>!done.includes(t)); }
function orderComplete(c){ return orderRemaining(c).length===0; }
function orderRemainingNames(c){ return orderRemaining(c).map(t=>t.startsWith('dish:')?'菜品':'饮料').join('+'); }

function handleServe(){
  const p=G.player, h=p.held; if(!h) return;
  const queued=G.customers.filter(c=>['queue','react'].includes(c.state));
  // 手持物 → 需求 token（成品菜 / 饮料）
  let token=null;
  if (h.type==='item' && RECIPES[h.id]) token='dish:'+h.id;
  else if (h.type==='drink') token='drink:'+h.drink;
  if (!token){ wrongDelivery('还没有完成菜品'); return; }
  // 命中订单中任意一个未完成需求即可；候选按"距离最近"分配（纯饮料单顾客更近时优先拿到饮料）
  const cands=queued.filter(c=>c.order && orderRemaining(c).includes(token));
  if (!cands.length){ wrongDelivery(h.type==='drink'?'没有客人需要此饮料':'菜品与订单不符'); return; }
  cands.sort((a,b)=>dist(p,a)-dist(p,b));
  const c=cands[0];
  c.order.done.push(token);
  if (token.startsWith('drink:')) c.drinkDone=true; else c.foodDone=true;
  p.held=null; SFX.success();
  if (orderComplete(c)) settleCustomer(c);                                   // 全部需求齐 → 结算满分
  else addFloatAt(c.x, c.y-40, '还差 '+orderRemainingNames(c), '#8fd14f');   // 部分交付：不计分也不扣分
}
function settleCustomer(c){
  const o=c.order;
  let pts = o.mode==='dish'?o.recipe.points:(o.mode==='combo'?o.recipe.points+DRINK_BONUS:DRINK_ONLY_POINTS);
  const mult=1+Math.min(G.combo,5)*0.10;
  const gained=Math.round(pts*mult);
  G.score+=gained; G.combo++; G.completed++;
  c.mood=0; c.reactT=0; c.state='react'; c.reactType='happy';
  SFX.success();
  addFloatAt(c.x,c.y-44,'+'+gained+(mult>1?' x'+G.combo:''),'#f5c542');
  spawnHeart(c.x,c.y-26);
}
function timeoutCustomer(c){
  c.mood=2; c.reactT=0; c.state='react'; c.reactType='angry';
  if (G.mode==='time'){ G.score-=TIMEOUT_PENALTY; G.mistakes++; addFloatAt(c.x,c.y-44,'-'+TIMEOUT_PENALTY+' 超时','#ff6b6b'); }
  else if (G.mode==='endless'){ G.hearts--; addFloatAt(c.x,c.y-44,'-1♥','#ff6b6b'); SFX.heart(); }
  G.combo=0;
  if (G.mode==='time') SFX.timeout();
  if (G.mode==='endless'&&G.hearts<=0) endGame();
}
function wrongDelivery(msg){
  if (G.mode==='time'){ G.score-=WRONG_PENALTY; G.mistakes++; addFloatAt(G.player.x,G.player.y-24,'-'+WRONG_PENALTY+' '+msg,'#ff6b6b'); }
  else if (G.mode==='endless'){ G.hearts--; addFloatAt(G.player.x,G.player.y-24,'-1♥','#ff6b6b'); SFX.heart(); }
  G.combo=0; G.shake=0.35;
  if (G.mode==='time') SFX.error();
  if (G.mode==='endless'&&G.hearts<=0) endGame();
}
function startFill(st){ if(G.player.held) return; G.fill={st,t:0}; SFX.fill(); dlog('fill','开始灌装 '+st.id+'('+DRINKS[st.drink].name+')'); }
function updateFill(dt){
  const f=G.fill; if(!f) return;
  // 根因修复：原先用 dist(player, station) 量到工作台“左上角”，右侧/下方靠近时误判超距立即取消。
  // 改为与 nearestStation 一致的“矩形最近边”判定，四周对称。
  const dx=clamp(G.player.x,f.st.x,f.st.x+f.st.w)-G.player.x;
  const dy=clamp(G.player.y,f.st.y,f.st.y+f.st.h)-G.player.y;
  if (Math.hypot(dx,dy) > G.player.r+14){ dlog('fill','取消：离开机器范围 '+f.st.id); G.fill=null; return; }
  f.t+=dt;
  if (f.t>=DRINK_FILL){ G.player.held=checkAndTransform({type:'drink',drink:f.st.drink}); G.fill=null; SFX.success(); addFloatAt(G.player.x,G.player.y-24,'饮料完成','#8fd14f'); dlog('fill','完成：获得 '+DRINKS[f.st.drink].name); }
}
function pickEvent(){

function triggerEvent(name){

function spawnRat(){

function pickSurfaceTarget(){ const cands=G.stations.filter(s=>s.surface&&(s.type==='board'||s.type==='pot'||s.type==='counter')); return cands.length?cands[randInt(0,cands.length-1)]:null; }
function scareRat(r){ if(r.state==='in'){ r.state='out'; r.fleeT=0; SFX.error(); addFloatAt(r.x,r.y-12,'赶走了！','#aef'); } }

 * 9. 交互

function onInteractPressed(){
  if (!G.running || G.paused) return;
  const p=G.player;
  for (const r of G.rats) if (dist(p,r)<20){ scareRat(r); return; }
  let bg=null,bd=1e9;
  for (const g of G.ground){ const d=dist(p,g); if (d<20&&d<bd){ bd=d; bg=g; } }
  if (bg){ if(!p.held){ p.held=bg.item; G.ground.splice(G.ground.indexOf(bg),1); SFX.pick(); } return; }
  const st=nearestStation(); if(!st) return;
  dlog('interact','目标站台 id='+st.id+' type='+st.type+(st.drink?' drink='+st.drink:'')+' held='+(p.held?(p.held.type+(p.held.drink?':'+p.held.drink:(p.held.ing?':'+p.held.ing+':'+p.held.state:''))):'空'));
  if (st.type==='pot'&&st.fire>0){
    if (p.held&&p.held.type==='extinguisher'){ st.fire-=0.34; SFX.exting(); spawnBurst(st.cx,st.cy,'#9ad7ff',8); if(st.fire<=0){ st.fire=0; st.burning=false; addFloatAt(st.cx,st.cy-18,'扑灭！','#aef'); } }
    else addFloatAt(p.x,p.y-24,'需要灭火器！','#ffb3ba');
    return;
  }
  switch(st.type){
    case 'crate': if(!p.held){ p.held=mkIngredient(st.ing,'raw'); SFX.pick(); } break;
    case 'exting': if(!p.held){ p.held={type:'extinguisher'}; SFX.pick(); } else if(p.held.type==='extinguisher'){ p.held=null; SFX.put(); } break;
    case 'drink': if(!p.held) startFill(st); break;
    case 'serving': handleServe(); break;
    case 'board': case 'pot': handleProcess(st); break;
    case 'counter': handleCounter(st); break;
  }
}
function canCut(it){ return isIngredient(it)&&it.state==='raw'&&ING[it.ing].cuttable; }
function canCook(it){ return isIngredient(it)&&ING[it.ing].cookable&&(it.state==='cut'||(it.ing==='rice'&&it.state==='raw')); }
/* 砧板/锅：只处理单个食材（切/煮） */
function handleProcess(st){
  const p=G.player, h=p.held;
  if (!h){ // 从锅/砧板拿起 → 统一成品判定（保证 锅→手 与 锅→台面→手 结果一致）
    if(st.surface){ p.held=checkAndTransform(st.surface, st.cx, st.cy-20); st.surface=null; st.progress=0; st.cutting=st.cooking=st.burning=false; SFX.pick(); }
    return;
  }
  if (st.surface) return; // 台面已占用，先取走
  if (!isIngredient(h)){ addFloatAt(p.x,p.y-24,'只能放单个食材','#ffb3ba'); return; }
  st.surface=h; p.held=null; st.progress=0; st.cutting=st.cooking=st.burning=false;
  if (st.type==='board'&&canCut(h)) st.cutting=true; else if (st.type==='pot'&&canCook(h)) st.cooking=true;
  st.surface = checkAndTransform(st.surface); // 放置也是状态变化点
  SFX.put();
}
/* 配菜台：组合（放置/合并/拾取；合并合法子集判定，完成即切成品ID） */
function handleCounter(st){
  const p=G.player, h=p.held;
  if (!h){ if(st.surface){ p.held=checkAndTransform(st.surface, st.cx, st.cy-20); st.surface=null; SFX.pick(); } return; }
  if (!st.surface){
    st.surface = checkAndTransform(h, p.x, p.y-24); // 放置：命中完整配方（如煮熟番茄→番茄汤）即成品
    p.held=null; SFX.put(); return;
  }
  const merged = toParts(h).concat(toParts(st.surface));
  if (isLegalSubset(merged)){ p.held=makeGroup(merged); st.surface=null; SFX.pick(); } // 合并 → 统一判定
  else { addFloatAt(p.x,p.y-24,'还不能组合','#ffb3ba'); SFX.error(); }
}

function nearestStation(){
  const p=G.player; let best=null,bd=1e9;
  for (const st of G.stations){
    const dx=clamp(p.x,st.x,st.x+st.w)-p.x, dy=clamp(p.y,st.y,st.y+st.h)-p.y;
    const d=Math.hypot(dx,dy);
    if (d<p.r+18&&d<bd){ bd=d; best=st; }
  }
  return best;
}
function movePlayer(dt){
  const p=G.player;
  const SPEED=CONFIG.playerSpeed*TILE, ACCEL=CONFIG.playerAccel*TILE; // 格/秒 → 像素/秒
  let dx=0,dy=0;
  if (keys['ArrowLeft']||keys['KeyA']) dx-=1;
  if (keys['ArrowRight']||keys['KeyD']) dx+=1;
  if (keys['ArrowUp']||keys['KeyW']) dy-=1;
  if (keys['ArrowDown']||keys['KeyS']) dy+=1;
  if (touch.active){ dx+=touch.dx; dy+=touch.dy; }
  const m=Math.hypot(dx,dy);
  let tx=0, ty=0;
  if (m>0.01){ dx/=m; dy/=m; tx=dx*SPEED; ty=dy*SPEED; p.facing=dx>=0?1:-1; }
  const ad=ACCEL*dt;                                 // 加速/减速缓冲：速度向目标逼近
  p.vx=clamp(tx, p.vx-ad, p.vx+ad);
  p.vy=clamp(ty, p.vy-ad, p.vy+ad);
  p.x+=p.vx*dt; p.y+=p.vy*dt;
  p.moving=Math.hypot(p.vx,p.vy)>6;
  if (p.moving) p.walk+=dt*10;
  p.x=clamp(p.x,p.r+12,W-p.r-12);
  p.y=clamp(p.y,p.r+KITCHEN_TOP,H-p.r-8);
  for (const st of G.stations){
    if (st.type==='serving'){ if(p.y+p.r>st.y&&p.y-p.r<st.y+st.h&&p.x+p.r>st.x&&p.x-p.r<st.x+st.w) p.y=st.y-p.r; continue; }
    resolveCircleRect(p,st);
  }
}
function resolveCircleRect(p,r){
  const cx=clamp(p.x,r.x,r.x+r.w), cy=clamp(p.y,r.y,r.y+r.h);
  let dx=p.x-cx, dy=p.y-cy; const d=Math.hypot(dx,dy);
  if (d<p.r){ if(d>0.0001){ dx/=d; dy/=d; p.x=cx+dx*p.r; p.y=cy+dy*p.r; }
    else { const l=p.x-r.x,rr=r.x+r.w-p.x,t=p.y-r.y,b=r.y+r.h-p.y; const mm=Math.min(l,rr,t,b);
      if(mm===l) p.x=r.x-p.r; else if(mm===rr) p.x=r.x+r.w+p.r; else if(mm===t) p.y=r.y-p.r; else p.y=r.y+r.h+p.r; } }
}
function updateStations(dt){
  const burn=G.difficulty.burn;
  for (const st of G.stations){
    st.fxTimer=(st.fxTimer||0)+dt;
    if (st.type==='board'&&st.cutting){ st.progress+=dt/CUT_TIME;
      if (st.progress>=1){ st.cutting=false; st.progress=0; if(st.surface&&isIngredient(st.surface)){ st.surface.state='cut'; SFX.chop(); spawnSlash(st.cx,st.cy); st.surface=checkAndTransform(st.surface, st.cx, st.cy-20); } }
      else if (Math.floor(st.progress*3)>Math.floor((st.progress-dt/CUT_TIME)*3)) spawnSlash(st.cx,st.cy); }
    if (st.type==='pot'&&st.fire<=0&&st.cooking){ if(G.blackout>0) continue; st.progress+=dt/COOK_TIME;
      if (st.progress>=1){ st.cooking=false; st.progress=0;
        if(st.surface&&isIngredient(st.surface)){ st.surface.state='cooked'; SFX.cookdone(); spawnSteam(st.cx,st.cy-10);
          st.surface=checkAndTransform(st.surface, st.cx, st.cy-20); } // 煮熟完成 → 统一判定（番茄→番茄汤 出锅即成品）
        st.burning = isIngredient(st.surface); } } // 已成成品则不再烧糊；仅食材态可烧糊
    if (st.type==='pot'&&st.fire<=0&&st.burning&&burn&&st.surface&&isIngredient(st.surface)&&st.surface.state==='cooked'){ if(G.blackout>0) continue;
      st.progress+=dt/(BASE_BURN/G.difficulty.burnSpeed);
      if (st.progress>=1){ st.surface.state='burnt'; st.burning=false; st.progress=0; spawnSmoke(st.cx,st.cy-10,'#5a3a20',1); } }
    if (st.type==='pot'&&st.fire>0){ if(st.surface&&isIngredient(st.surface)&&st.surface.state!=='burnt'){ st.surface.state='burnt'; st.burning=false; SFX.fire(); }
      spawnSmoke(st.cx,st.cy-10,'#e05a00',1.2); G.fireGlow=Math.min(1,G.fireGlow+dt*2); }
    // 煮熟持续冒热气 / 成品冒热气 / 烧糊冒烟
    if (st.type==='pot'&&st.surface&&st.fxTimer>0.45){
      st.fxTimer=0;
      if (!isIngredient(st.surface) || st.surface.state==='cooked') spawnSteam(st.cx,st.cy-10);
      else if (st.surface.state==='burnt') spawnSmoke(st.cx,st.cy-10,'#5a3a20',1);
    }
  }
}
function updateRats(dt){
  const p=G.player;
  for(let i=G.rats.length-1;i>=0;i--){ const r=G.rats[i];
    if (dist(p,r)<p.r+12) scareRat(r);
    if (r.state==='in'){ const dx=r.tx-r.x,dy=r.ty-r.y,d=Math.hypot(dx,dy);
      if (d<6){ if(r.st&&r.st.surface){ r.st.surface=null; r.st.progress=0; r.st.cutting=r.st.cooking=r.st.burning=false; addFloatAt(r.x,r.y-12,'食材被叼走！','#ff6b6b'); SFX.error(); } r.state='out'; }
      else { r.x+=dx/d*52*dt; r.y+=dy/d*52*dt; } }
    else { r.fleeT+=dt; r.x+=(r.x<W/2?1:-1)*68*dt; r.y=clamp(r.y,KITCHEN_TOP+6,COUNTER_Y-6); if(r.x<-24||r.x>W+24||r.fleeT>5) G.rats.splice(i,1); } }
}
function updateEvents(dt){
  if (G.mode==='tutorial') return;
  G.nextEventIn-=dt;
  if (G.nextEventIn<=3&&G.nextEventIn>0&&!G.bannerEvent) G.bannerEvent=pickEvent();
  if (G.nextEventIn<=0){ const ev=G.bannerEvent||pickEvent(); G.bannerEvent=null; if(ev) triggerEvent(ev); G.nextEventIn=G.difficulty.eventInterval; }
}
function updateFx(dt){
  for(let i=G.particles.length-1;i>=0;i--){ const q=G.particles[i]; q.t+=dt; q.x+=q.vx*dt; q.y+=q.vy*dt; if(q.t>=q.life) G.particles.splice(i,1); }
  for(let i=G.floats.length-1;i>=0;i--){ const f=G.floats[i]; f.t+=dt; f.y+=f.vy*dt; f.vy*=0.96; if(f.t>=f.life) G.floats.splice(i,1); }
}
function addFloatAt(x,y,text,color){ G.floats.push({x,y,vy:-14,text,color,life:1.1,t:0}); }
function spawnSlash(x,y){ for(let i=0;i<4;i++) G.particles.push({x:x+rand(-6,6),y:y+rand(-6,6),vx:rand(-30,30),vy:rand(-50,-14),life:.3,t:0,c:'#eef6ff',r:1}); }
function spawnSteam(x,y){ for(let i=0;i<4;i++) G.particles.push({x:x+rand(-4,4),y:y,vx:rand(-4,4),vy:rand(-26,-14),life:.7,t:0,c:'#ddd',r:1}); }
function spawnSmoke(x,y,c,rate){ for(let i=0;i<(rate||1)*3;i++) G.particles.push({x:x+rand(-4,4),y:y,vx:rand(-4,4),vy:rand(-30,-18),life:.9,t:0,c:c,r:1}); }
function spawnBurst(x,y,c,n){ for(let i=0;i<n;i++) G.particles.push({x,y,vx:rand(-36,36),vy:rand(-60,-12),life:.4,t:0,c,r:1}); }
function spawnHeart(x,y){ for(let i=0;i<3;i++) G.particles.push({x:x+rand(-5,5),y:y,vx:rand(-8,8),vy:rand(-32,-18),life:.8,t:0,c:'#ff6b6b',r:1,heart:true}); }

let lastTs=0;
function loop(ts){
  requestAnimationFrame(loop);
  if(!lastTs) lastTs=ts;
  let dt=clamp((ts-lastTs)/1000,0,0.05); lastTs=ts;
  if (G.running&&!G.paused&&!G.glossaryOpen){
    G.elapsed+=dt;
    if (G.mode==='time'){ G.timeLeft-=dt; if(G.timeLeft<=0){ G.timeLeft=0; endGame(); } }
    movePlayer(dt); updateStations(dt); updateCustomers(dt); updateEvents(dt); updateFill(dt); updateRats(dt); updateFx(dt);
    if (G.blackout>0) G.blackout-=dt;
    G.fireGlow=Math.max(0,G.fireGlow-dt*0.6); G.shake=Math.max(0,G.shake-dt*2.2);
    if (G.tutorial){ const s=TUT_STEPS[G.tutorial.step]; if(s.check()) advanceTutorial(); }
  }
  render();
}

function drawTiles(){
  for (let ty=0; ty<H; ty+=TILE) for (let tx=0; tx<W; tx+=TILE){

function drawStation(st){

  else { fillRect('#7a4a1e',x,y+4,w,h-4); fillRect('#9a6230',x+2,y+4,w-4,4); }

function drawCustomer(c){

function stationHint(st){
  const p=G.player,h=p.held;
  switch(st.type){
    case 'crate': return h?'手上有东西':'拿'+ING[st.ing].name;
    case 'exting': return !h?'拿灭火器':(h.type==='extinguisher'?'放回':'手上有东西');
    case 'drink': return h?'手上有东西':'灌'+DRINKS[st.drink].name;
    case 'serving': return h?((h.type==='item'&&RECIPES[h.id])?'交付菜品':(h.type==='drink'?'交付饮料':'手上有东西')):'前台';
    case 'board': case 'pot':
      if(st.fire>0) return h&&h.type==='extinguisher'?'连按灭火':'要灭火器';
      if(!h) return st.surface?'拿起':'放食材';
      if(!st.surface){ if(st.type==='board'&&canCut(h)) return '切菜'; if(st.type==='pot'&&canCook(h)) return '煮'; return '只能放食材'; }
      return '已占用';

      if(!h) return st.surface?'拿起':'放下食材';
      if(!st.surface) return '放下';
      return '组合';
  }
  return '';
}

/* ============================================================
 * 13. 缩放（整数倍 + 竖屏非整数，实时重算，信封边纹理）
 * ============================================================ */
function resize(){
  const vw=innerWidth, vh=innerHeight;
  const portrait = vh>vw;
  let s = Math.min(vw/W, vh/H);
  if (!portrait && s>1) s=Math.floor(s);        // 桌面取最大整数倍
  s = Math.max(s, Math.min(vw/W, vh/H));        // 保证不小于 contain（竖屏非整数放大）
  canvas.style.width = Math.round(W*s)+'px';
  canvas.style.height = Math.round(H*s)+'px';
}
addEventListener('resize',resize);
addEventListener('orientationchange',resize);
if (window.matchMedia) window.matchMedia('(orientation: portrait)').addEventListener('change',resize);

function makeIcon(size){
  const cv=document.createElement('canvas'); cv.width=cv.height=size;
  const c=cv.getContext('2d'); c.imageSmoothingEnabled=false;
  c.fillStyle='#140e08'; c.fillRect(0,0,size,size);
  const pad=Math.round(size*0.06);
  c.fillStyle='#2a1a12'; c.fillRect(pad,pad,size-pad*2,size-pad*2);
  c.strokeStyle='#7a4a1e'; c.lineWidth=Math.max(2,Math.round(size*0.035)); c.strokeRect(pad,pad,size-pad*2,size-pad*2);
  const s=Math.round(size*0.6), o=Math.round((size-s)/2);
  c.drawImage(sprite('dish_burger'), o, o, s, s);
  return cv.toDataURL('image/png');
}

    };
    // 单文件内联 manifest：即使只复制 HTML 也能安装（与同目录 manifest.json 等价）
    const blob=new Blob([JSON.stringify(manifest)],{type:'application/manifest+json'});
    $('manifestLink').href=URL.createObjectURL(blob);
  } catch(e){}
  // Service Worker：缓存全部资源，断网可玩；file:// 或缺失 sw.js 时静默降级
  if ('serviceWorker' in navigator && /^https?:/.test(location.protocol)){
    navigator.serviceWorker.register('sw.js').catch(()=>{});
  }
}
function initSplash(){
  try { $('splashLogo').src=makeIcon(192); } catch(e){}
  setTimeout(()=>{ const s=$('splash'); if(!s) return; s.classList.add('hide'); setTimeout(()=>{ s.style.display='none'; },450); }, 900);
}
let rotateDismissed=false;
function checkOrientation(){
  const el=$('scrRotate'); if(!el) return;
  el.classList.toggle('hidden', !(innerHeight>innerWidth && !rotateDismissed));
}
function onMenuPressed(){ // ESC / 触屏"菜单"键统一入口
  if (G.glossaryOpen) closeGlossary();        // 配料表打开时优先关闭
  else if (G.tutorial) endTutorial();         // 教程模式 = 跳过教程
  else if (G.pauseMenu) closePauseMenu();     // 已暂停 = 继续
  else if (G.running) togglePauseMenu();      // 游戏中 = 暂停
}

/* ============================================================
 * 17. 启动
 * ============================================================ */
let clearConfirm=false;
function goDiff(){ showScreen('scrDiff'); buildDiffCards(); }
function boot(){
  $('versionLabel').textContent = 'v'+VERSION; // 主菜单标题栏显示当前版本号
  makeTiles(); buildDiffCards(); setupTouch(); resize();
  $('btnBackMode').onclick=()=>goDiff();
  document.querySelectorAll('#scrMode .card').forEach(c=>c.onclick=()=>startGame(c.dataset.mode));
  $('btnAgain').onclick=()=>startGame(G.mode);
  $('btnHome').onclick=()=>goDiff();
  $('btnSettings').onclick=()=>{ refreshSettingsUI(); showScreen('scrSettings'); };
  $('btnBackSettings').onclick=()=>goDiff();
  $('btnTutorial').onclick=()=>startTutorial();
  $('btnTutorialSkip').onclick=()=>endTutorial();
  $('btnTutDoneBack').onclick=()=>goDiff();
  $('btnBook').onclick=()=>toggleGlossary();
  $('btnCloseGlossary').onclick=()=>closeGlossary();
  $('btnTutYes').onclick=()=>{ markTutorialSeen(); showScreen(null); startTutorial(); };
  $('btnTutNo').onclick=()=>{ markTutorialSeen(); goDiff(); };
  $('settingSupply').onclick=()=>{ SETTINGS.supply=!SETTINGS.supply; saveSettings(); refreshSettingsUI(); };
  $('btnPauseResume').onclick=()=>closePauseMenu();
  $('btnPauseHome').onclick=()=>pauseMenuHome();
  $('btnClearBest').onclick=()=>{
    if(!clearConfirm){ clearConfirm=true; $('btnClearBest').textContent='再点一次确认清除'; setTimeout(()=>{ clearConfirm=false; $('btnClearBest').textContent='清除所有记录'; },3000); }
    else { clearAllBest(); clearConfirm=false; $('btnClearBest').textContent='清除所有记录'; buildDiffCards(); }
  };
  document.addEventListener('visibilitychange',()=>{ if(document.hidden&&G.running&&!G.paused&&!G.tutorial&&!G.glossaryOpen) openPauseMenu(); });
  // 触屏"菜单"键 + 竖屏提示 + PWA/启动画面
  $('btnMenu').addEventListener('touchstart',(e)=>{ onMenuPressed(); e.preventDefault(); });
  $('btnRotateOk').onclick=()=>{ rotateDismissed=true; $('scrRotate').classList.add('hidden'); };
  addEventListener('resize', checkOrientation); addEventListener('orientationchange', checkOrientation);
  initSplash(); initPWA(); checkOrientation();
  refreshSettingsUI();
  if (!tutorialSeen()) showScreen('scrPrompt'); else showScreen('scrDiff');
  requestAnimationFrame(loop);
}
function refreshSettingsUI(){ $('settingSupply').classList.toggle('on',SETTINGS.supply); }
boot();
</script>
